<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF5EC"/><stop offset="1" stop-color="#EFE2D0"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A5A36"/><stop offset="1" stop-color="#5E3A20"/></linearGradient>
    <clipPath id="c"><circle cx="80" cy="80" r="80"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="160" height="160" fill="url(#bg)"/>
    <!-- sun -->
    <g transform="translate(122 38)">
      <circle r="30" fill="#FFC72C" opacity=".22"/>
      <circle r="16" fill="#FFC72C"/>
      <g stroke="#F5B800" stroke-width="3" stroke-linecap="round"><path d="M0 -24v-6"/><path d="M-24 0h-6"/><path d="M-17 -17l-4 -4"/><path d="M-17 17l-4 4"/><path d="M17 -17l4 -4"/></g>
    </g>
    <!-- growth bars -->
    <g fill="#0F7A3D" opacity=".14"><rect x="18" y="96" width="14" height="30" rx="3"/><rect x="128" y="80" width="14" height="46" rx="3"/></g>
    <!-- soil mound -->
    <path d="M-10 124 Q80 98 170 124 V170 H-10Z" fill="url(#soil)"/>
    <g fill="#C8955E" opacity=".5"><circle cx="50" cy="132" r="2"/><circle cx="96" cy="140" r="2.4"/><circle cx="120" cy="132" r="1.6"/><circle cx="70" cy="148" r="1.8"/></g>
    <!-- seed husk -->
    <ellipse cx="80" cy="118" rx="9" ry="5" fill="#C8955E"/>
    <!-- stem -->
    <path d="M80 118 C80 96 78 78 82 56" stroke="#0F7A3D" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- leaves -->
    <path d="M80 92 C64 94 50 84 46 68 C62 66 76 76 80 92Z" fill="#3FA75F"/>
    <path d="M80 92 C70 86 60 78 50 70" stroke="#D7F0DF" stroke-width="1.3" fill="none"/>
    <path d="M81 76 C96 76 108 64 110 48 C94 48 82 60 81 76Z" fill="#1F8A4C"/>
    <path d="M81 76 C90 68 100 58 108 50" stroke="#D7F0DF" stroke-width="1.3" fill="none"/>
    <path d="M82 58 C76 48 76 38 82 28 C88 38 88 48 82 58Z" fill="#57B66F"/>
    <!-- up arrow -->
    <g transform="translate(36 52)">
      <circle r="15" fill="#fff" stroke="#E3E7E4"/>
      <path d="M0 8 V-7 M-6 -1 L0 -7 L6 -1" stroke="#0F7A3D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g fill="#FFC72C"><circle cx="58" cy="40" r="2.4"/><circle cx="104" cy="88" r="2"/><circle cx="62" cy="106" r="1.6"/></g>
  </g>
</svg>
