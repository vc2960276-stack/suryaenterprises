<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1F8E6"/><stop offset="1" stop-color="#DCEFC8"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1F8A4C"/><stop offset="1" stop-color="#57B66F"/></linearGradient>
    <clipPath id="c"><circle cx="80" cy="80" r="80"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="160" height="160" fill="url(#bg)"/>
    <!-- stem -->
    <path d="M40 160 C46 130 50 112 62 96" stroke="#0F7A3D" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- big leaf -->
    <path d="M62 96 C50 60 70 26 120 18 C132 60 112 96 62 96Z" fill="url(#leaf)"/>
    <path d="M62 96 C80 74 100 46 120 18" stroke="#D7F0DF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <g stroke="#D7F0DF" stroke-width="1.3" fill="none" opacity=".8" stroke-linecap="round">
      <path d="M72 82 C68 72 68 62 72 54"/><path d="M80 72 C90 72 100 76 108 82"/><path d="M90 58 C88 50 90 42 94 36"/><path d="M98 48 C106 48 112 50 118 54"/>
    </g>
    <!-- lesions -->
    <g>
      <circle cx="84" cy="56" r="8" fill="#E9C24A"/><circle cx="84" cy="56" r="5" fill="#A0652F"/><circle cx="84" cy="56" r="2" fill="#5E3A20"/>
      <circle cx="104" cy="66" r="6" fill="#E9C24A"/><circle cx="104" cy="66" r="3.6" fill="#A0652F"/>
      <circle cx="74" cy="78" r="4.5" fill="#E9C24A"/><circle cx="74" cy="78" r="2.4" fill="#A0652F"/>
      <circle cx="100" cy="36" r="3.6" fill="#E9C24A"/><circle cx="100" cy="36" r="1.8" fill="#A0652F"/>
    </g>
    <!-- small leaf -->
    <path d="M50 120 C30 118 18 104 16 88 C34 88 46 100 50 120Z" fill="#3FA75F"/>
    <circle cx="32" cy="100" r="3.4" fill="#E9C24A"/><circle cx="32" cy="100" r="1.6" fill="#A0652F"/>
    <!-- magnifier -->
    <g transform="translate(100 104)">
      <path d="M14 14 L34 34" stroke="#7A4E2D" stroke-width="9" stroke-linecap="round"/>
      <circle r="20" fill="#fff" fill-opacity=".45" stroke="#14211A" stroke-width="5"/>
      <circle r="20" fill="none" stroke="#FFC72C" stroke-width="2" opacity=".9"/>
      <path d="M-10 -8 A13 13 0 0 1 -2 -14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g opacity=".85"><circle cx="2" cy="4" r="3" fill="#A0652F"/><circle cx="-5" cy="8" r="1.8" fill="#A0652F"/><circle cx="7" cy="-3" r="1.6" fill="#A0652F"/></g>
    </g>
  </g>
</svg>
